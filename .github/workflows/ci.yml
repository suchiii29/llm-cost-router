name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PROVIDER_MODE: fake
      ROUTER_API_KEY: ci-only-placeholder
      DB_URL: sqlite://
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check
      - name: Test
        run: pytest -q
      - name: Build container image
        run: docker build --tag llm-cost-router:ci .
